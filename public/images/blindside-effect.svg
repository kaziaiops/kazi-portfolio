<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="g" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1c1416"/>
      <stop offset="55%" stop-color="#0c0e13"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.38" r="0.55">
      <stop offset="0%" stop-color="#E9A94B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E9A94B" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- the blind spot: concentric rings of attention, with a wedge of the field cut away -->
  <g fill="none" stroke="#E9A94B" stroke-width="2" transform="translate(1380 410)">
    <circle r="90" opacity="0.5"/>
    <circle r="190" opacity="0.32"/>
    <circle r="300" opacity="0.2"/>
    <circle r="420" opacity="0.12"/>
    <circle r="550" opacity="0.07"/>
  </g>
  <path d="M1380 410 L1980 110 L1980 710 Z" fill="#0A0C10" opacity="0.92"/>
  <circle cx="1380" cy="410" r="8" fill="#E9A94B" opacity="0.85"/>

  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.05"/>
</svg>
